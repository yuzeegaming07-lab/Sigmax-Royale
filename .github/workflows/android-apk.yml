
name: Build Sigmax-Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find and extract project
        run: |
          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ZIP project tidak ditemukan!"
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted

            PACKAGE=$(find extracted -type f -name package.json | head -n 1)

            if [ -z "$PACKAGE" ]; then
              echo "package.json tidak ditemukan!"
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sigmax-Royale-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

{
  "appId": "com.sigmaxroyale.game",
  "appName": "Sigmax-Royale",
  "webDir": "www"
}
